<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glance">
  <!-- Browser-tab icon: the wordmark's G and its yellow cell. A whole word is unreadable at 16 px.
       The font is embedded because an icon file cannot use the page's fonts. -->
  <style>@font-face { font-family: "AH"; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }</style>
  <rect width="64" height="64" rx="14" fill="#0b2545"/>
  <text x="27" y="47" text-anchor="middle" fill="#fff"
        font-family="AH, Atkinson Hyperlegible, Avenir Next, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700">G</text>
  <rect x="44" y="37" width="10" height="10" rx="2" fill="#ffd400"/>
</svg>
