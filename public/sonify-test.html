<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sonify.js test</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    button { font: inherit; padding: .6rem 1rem; margin: .25rem .25rem .25rem 0; }
    #log { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; margin-top: 1rem; }
    #tuning { background: #eef3fa; padding: 1rem; margin: 1rem 0; }
    #tuning label { display: inline-block; margin: .2rem 0; }
    #tuning input { vertical-align: middle; margin: 0 .5rem; }
  </style>
</head>
<body>
  <h1>sonify.js on its own</h1>
  <p>Temporary page for checking Trend Scan without the rest of the app.
     Click a button; you should hear tones.</p>

  <div id="tuning">
    <label>Note length <input id="noteMs" type="range" min="150" max="800" step="20" value="400"><span id="noteMsV">400</span> ms</label><br>
    <label>Volume <input id="gain" type="range" min="0.1" max="1" step="0.05" value="0.5"><span id="gainV">0.5</span></label><br>
    <label>Lowest pitch <input id="lowHz" type="range" min="60" max="440" step="10" value="110"><span id="lowHzV">110</span> Hz</label><br>
    <label>Highest pitch <input id="highHz" type="range" min="440" max="3000" step="20" value="1760"><span id="highHzV">1760</span> Hz</label><br>
    <label>Shape vs register <input id="localSpan" type="range" min="0.05" max="0.7" step="0.01" value="0.34"><span id="localSpanV">0.34</span></label>
    <br><small>Left: rows sit further apart, shapes flatter. Right: shapes bigger, rows harder to tell apart.</small>
  </div>

  <button id="rise">Steady climb (should rise evenly)</button>
  <button id="italy">Italy: climbs then falls off a cliff</button>
  <button id="small">A smaller country (should sound lower overall)</button>
  <button id="stop">Stop</button>

  <div id="log">loading…</div>

<script type="module">
const log = document.getElementById("log");
const say = (m) => { log.textContent += "\n" + m; };

let s;
try {
  s = await import("./sonify.js");
  log.textContent = "sonify.js loaded.";
  say("isSupported(): " + s.isSupported());
} catch (err) {
  log.textContent = "FAILED to load sonify.js: " + err.message;
  throw err;
}

// One scale for the whole sheet, exactly as app.js does it.
const sheet = [];
for (let row = 0; row < 8; row++)
  for (let m = 0; m < 12; m++) sheet.push(70000 + row * 12000 + m * 6000);
sheet.push(390000);
s.setScale(sheet);
say("setScale() with " + sheet.length + " values -> hasScale(): " + s.hasScale());

// Live tuning: move a slider, press a button, hear the difference immediately.
const tune = () => {
  const num = (id) => Number(document.getElementById(id).value);
  for (const id of ["noteMs", "gain", "lowHz", "highHz", "localSpan"])
    document.getElementById(id + "V").textContent = document.getElementById(id).value;
  s.configure({ noteMs: num("noteMs"), gain: num("gain"), lowHz: num("lowHz"),
                highHz: num("highHz"), localSpan: num("localSpan") });
};
for (const id of ["noteMs", "gain", "lowHz", "highHz", "localSpan"])
  document.getElementById(id).addEventListener("input", tune);
tune();
say("Move the sliders, then press a button. Tell Margaux the numbers that sound right.");

const play = (values, label) => {
  const ms = s.playSeries({ values, label, unit: "€" });
  say(`\n${label}\n  ${s.describe({ values, label, unit: "€" })}\n  playSeries returned ${ms} ms`);
  if (ms === 0) say("  ^ returned 0: nothing was scheduled.");
};

document.getElementById("rise").onclick = () =>
  play([70000, 85000, 100000, 115000, 130000, 145000, 160000, 175000], "Steady climb");

document.getElementById("italy").onclick = () =>
  play([100000, 110000, 121000, 132000, 141000, 147000, 154000, 62000, 69000, 76000, 82000, 89000],
       "Italy, January to December");

document.getElementById("small").onclick = () =>
  play([70000, 72000, 74000, 71000, 75000, 73000, 76000, 74000], "A smaller country");

document.getElementById("stop").onclick = () => { s.stop(); say("stopped"); };
</script>
</body>
</html>
