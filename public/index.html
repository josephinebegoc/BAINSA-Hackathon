<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Attention for Excel</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>Accessible Attention for Excel</h1>
    <p class="tagline">Screen readers make spreadsheet cells readable. We make visual attention accessible.</p>
    <div class="controls">
      <button type="button" id="load-demo">Load demo</button>
    </div>
    <p id="status">Press "Load demo" to open the sample sales sheet.</p>
  </header>

  <main>
    <h2 id="sheet-title" hidden></h2>
    <div id="grid"
         role="application"
         tabindex="0"
         aria-label="Spreadsheet. Use the arrow keys to move between cells. Press N for the next important cell, and H for help.">
    </div>
  </main>
</body>
</html>
